<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mvbd+ | Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!-- আইকন (user, key, Google, Apple ইত্যাদি) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
/* নাইট মোড */
:root{--panel-top:#000;--panel-bottom:#000;--blob:#000;--field:#260b36;--text:#fff;--muted:rgba(255,255,255,.8);--error:#ffe08a;--page:#000;
  --btn:linear-gradient(180deg,#c41434 0%,#3a0d36 100%)}
/* লাইট মোড */
html[data-theme="light"]{--panel-top:#fbd5dd;--panel-bottom:#fff6f8;--blob:#c41434;--field:#fff;--text:#260b36;--muted:rgba(38,11,54,.75);--error:#b00020;--page:#fff6f8;
  --btn:linear-gradient(180deg,#d8183b 0%,#8e1040 100%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:0 14px;background:var(--page);color:var(--text)}

/* ===== ব্যাকগ্রাউন্ডে মুভির পোস্টার (কোনো রঙের আস্তরণ নেই) ===== */
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background-image:url("https://i.postimg.cc/YkTYH5Kz/images.jpg"),url("https://i.postimg.cc/7YMf1QL5/images.jpg");
  background-size:min(100vw,592px) auto;background-position:center top;background-repeat:repeat}

.phone{width:100%;max-width:405px;position:relative}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;animation:fade .35s ease}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.theme-btn{position:absolute;top:14px;right:0;z-index:20;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(255,255,255,.8);background:rgba(38,11,54,.75);color:#fff;cursor:pointer}
.ic{width:20px;height:20px;flex-shrink:0}

/* ===== লোগো: উপরে মাঝখানে, পেছনে কোনো রং নেই ===== */
.logo-area{height:180px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  filter:drop-shadow(0 1px 3px #000) drop-shadow(0 0 6px rgba(0,0,0,.7))}
.logo{display:block;width:100px;height:88px;flex-shrink:0}
#welcome .logo{width:72px;height:63px}
.logo-area h2{font-family:'Montserrat',sans-serif;font-size:32px;line-height:1.2;margin-top:6px}
.logo-area span{font-family:'Montserrat',sans-serif;font-size:13px;letter-spacing:4px}

/* ===== বাঁকানো প্যানেল ===== */
.cap{display:block;width:100%;height:52px;flex-shrink:0}
.cap path{fill:var(--panel-top)}
.panel{flex:1;display:flex;flex-direction:column;margin-top:-1px;padding:0 30px 20px;position:relative;
  background:linear-gradient(180deg,var(--panel-top),var(--panel-bottom) 92%)}
.blob{position:absolute;left:0;bottom:0;width:200px;height:193px;pointer-events:none}
.panel>:not(.blob){position:relative}

.panel h1{font-size:32px;text-align:center;line-height:1.1;margin-bottom:8px}
.intro{font-size:12.5px;text-align:center;max-width:270px;margin:0 auto}
.welcome-actions{display:flex;flex-direction:column;gap:14px;margin:26px 20px 0}

.btn{position:relative;isolation:isolate;border:0;background:none;color:#fff;font:700 16px 'Open Sans',sans-serif;height:48px;flex-shrink:0;cursor:pointer;width:100%}
.btn::before{content:"";position:absolute;inset:0 4px;z-index:-1;border-radius:17px;background:var(--btn);transform:skewX(-10deg);box-shadow:0 5px 14px rgba(0,0,0,.2);transition:filter .2s}
.btn:hover::before{filter:brightness(1.18)}
.btn:disabled{cursor:wait;opacity:.8}
.btn.small{width:130px;align-self:center}

.social{text-align:center;margin-top:16px}
.social p{font-size:14px;font-weight:700;margin-bottom:10px}
.social-row{display:flex;gap:14px;justify-content:center}
.social-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-width:112px;height:38px;border-radius:13px;cursor:pointer;
  border:1.5px solid var(--text);background:transparent;color:var(--text);font:600 14px 'Open Sans',sans-serif}
.social-btn i{font-size:18px}

form{display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;flex-shrink:0;background:var(--field);border-radius:14px;padding:3px}
.tabs button{flex:1;border:0;background:none;color:var(--text);cursor:pointer;font:600 13px 'Open Sans',sans-serif;padding:7px;border-radius:11px}
.tabs button.on{background:var(--btn);color:#fff}
.field{position:relative;isolation:isolate;display:flex;align-items:center;height:52px}
.field::before{content:"";position:absolute;inset:0 -1px;z-index:-1;border-radius:17px;background:var(--field);transform:skewX(-10deg);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.field:focus-within::before{outline:2px solid #ff6b86}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--text);font:600 15px 'Open Sans',sans-serif;padding:0 10px 0 20px}
.field input::placeholder{color:var(--text);opacity:.9}
.field input:-webkit-autofill{-webkit-text-fill-color:var(--text);transition:background-color 99999s}
.ico{position:relative;isolation:isolate;width:48px;height:40px;margin-right:5px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:#fff}
.ico::before{content:"";position:absolute;inset:0 1px;z-index:-1;border-radius:12px;background:var(--btn);transform:skewX(-10deg)}
button.ico{cursor:pointer}
.check{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;cursor:pointer}
.check.left{justify-content:flex-start}
.check input{width:14px;height:14px;accent-color:#c41434}
.error{min-height:18px;text-align:center;font-size:12.5px;font-weight:700;color:var(--error);margin:-4px 0}

.footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:22px}
.back{display:flex;align-items:center;gap:9px;border:0;background:none;color:#fff;font:700 16px 'Open Sans',sans-serif;cursor:pointer}
.back .circle{width:31px;height:31px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.back .ic{width:16px;height:16px}
.switch{text-align:right;font-size:13.5px}
.switch button{display:block;margin-left:auto;border:0;background:none;color:var(--text);font:700 20px 'Open Sans',sans-serif;cursor:pointer}

.success .panel{align-items:center;text-align:center}
.tick{width:96px;height:96px;flex-shrink:0;border-radius:50%;margin:14px 0 22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#2ecc71,#148a47);color:#fff}
.tick .ic{width:52px;height:52px}
.success.active .tick{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.success h2{font-size:24px;margin-bottom:8px}
.success p{color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.success .btn{max-width:230px;margin-top:26px}
.success .demo-note{font-size:12px;margin-top:14px}

.loader{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(20,4,30,.85);color:#fff;font-weight:600}
.loader.show{display:flex}
.spin{width:48px;height:48px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:#ff3b5f;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sign in / Sign up / Success: লোগো কালো প্যানেলের ঠিক উপরে, মাঝখানে
   (আরও নিচে নামাতে -11px কে -30px করুন) */
.screen:not(#welcome) .logo-area{justify-content:flex-end;position:relative;z-index:2}
.screen:not(#welcome) .logo{margin-bottom:-11px}
/* Forgot Password: Password লেখার ঠিক নিচে */
.forgot{align-self:flex-start;margin:-6px 0 0 20px;border:0;background:none;color:var(--text);font:700 13px 'Open Sans',sans-serif;text-decoration:underline;cursor:pointer;padding:2px 0}
</style>
</head>
<body>

<!-- লোগো: নিজের ছবি দিতে চাইলে <svg class="logo">…</svg> এর বদলে
     <img class="logo" src="your-logo.png" alt="Logo"> ব্যবহার করুন -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <linearGradient id="blobg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--blob)"/><stop offset="1" style="stop-color:var(--blob);stop-opacity:0"/></linearGradient>
  <symbol id="mark" viewBox="0 0 100 88">
    <polygon points="27,4 73,4 96,44 73,84 27,84 4,44" fill="none" stroke="currentColor" stroke-width="4"/>
    <path fill="currentColor" d="M36 20L50 33L64 20V33L50 46L36 33Z M29 32L50 51L71 32V52L50 72L29 52Z"/>
  </symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4.5" fill="currentColor"/><path fill="currentColor" d="M3 21c0-5 4-8 9-8s9 3 9 8Z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></g></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></g></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="5"/><path d="M11.5 11.5 20 3m-4 4 3 3"/></g></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></g></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path fill="currentColor" d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m4 12.5 5.5 5.5L20 7"/></symbol>
</svg>

<main class="phone">
  <button class="theme-btn" id="themeBtn" type="button" aria-label="Change light / night mode"><svg class="ic" aria-hidden="true"><use href="#i-sun"/></svg></button>

  <!-- ========== 1. WELCOME ========== -->
  <section class="screen active" id="welcome">
    <div class="logo-area">
      <svg class="logo"><use href="#mark"/></svg>
      <h2>mvbd+</h2>
      <span>SLOGAN HERE</span>
    </div>
    <svg class="cap" viewBox="0 0 405 52" preserveAspectRatio="none" aria-hidden="true"><path d="M0 52C0 37 20 25 50 24L350 0C382 0 405 22 405 52Z"/></svg>
    <div class="panel">
    <svg class="blob" viewBox="0 0 200 193" aria-hidden="true"><path fill="url(#blobg)" d="M0 0C15 50 50 86 100 90C150 94 175 125 200 193H0Z"/></svg>
    <h1>Welcome</h1>
    <p class="intro">Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna</p>
    <div class="welcome-actions">
      <button class="btn" type="button" data-go="signin">Sign in</button>
      <button class="btn" type="button" data-go="signup">Sign up</button>
    </div>
    <div class="social"><p>Sign in with Social Media</p>
      <div class="social-row">
        <button class="social-btn" type="button" data-social="Google"><i class="fa-brands fa-google"></i>Google</button>
        <button class="social-btn" type="button" data-social="Apple"><i class="fa-brands fa-apple"></i>Apple</button>
      </div>
    </div>
    </div>
  </section>

  <!-- ========== 2. SIGN UP ========== -->
  <section class="screen" id="signup">
    <div class="logo-area"><svg class="logo"><use href="#mark"/></svg></div>
    <svg class="cap" viewBox="0 0 405 52" preserveAspectRatio="none" aria-hidden="true"><path d="M0 52C0 37 20 25 50 24L350 0C382 0 405 22 405 52Z"/></svg>
    <div class="panel">
    <svg class="blob" viewBox="0 0 200 193" aria-hidden="true"><path fill="url(#blobg)" d="M0 0C15 50 50 86 100 90C150 94 175 125 200 193H0Z"/></svg>
    <form id="signupForm" novalidate>
        <div class="field">
          <input id="first" type="text" placeholder="First Name" aria-label="First Name" autocomplete="given-name">
          <span class="ico"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg></span>
        </div>
        <div class="field">
          <input id="last" type="text" placeholder="Last Name" aria-label="Last Name" autocomplete="family-name">
          <span class="ico"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg></span>
        </div>
        <div class="tabs">
          <button type="button" class="on" data-type="email">E-mail</button>
          <button type="button" data-type="phone">Phone</button>
        </div>
        <div class="field">
          <input class="ident" id="upIdent" type="email" placeholder="E-mail" aria-label="E-mail" autocomplete="email">
          <span class="ico"><svg class="ic ident-icon" aria-hidden="true"><use href="#i-mail"/></svg></span>
        </div>
        <div class="field">
          <input id="upPass" type="password" placeholder="Password" aria-label="Password" autocomplete="new-password">
          <button class="ico eye" type="button" aria-label="Show password"><svg class="ic" aria-hidden="true"><use href="#i-key"/></svg></button>
        </div>
        <label class="check"><input id="terms" type="checkbox"> Allow Term &amp; Conditions</label>
        <div class="error" role="alert"></div>
        <button class="btn small" type="submit">Sign up</button>
    </form>
    <div class="social">
      <div class="social-row">
        <button class="social-btn" type="button" data-social="Google"><i class="fa-brands fa-google"></i>Google</button>
        <button class="social-btn" type="button" data-social="Apple"><i class="fa-brands fa-apple"></i>Apple</button>
      </div>
    </div>
    <div class="footer">
      <button class="back" type="button" data-go="welcome"><span class="circle"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></span>Back</button>
      <div class="switch">Already have an account?<button type="button" data-go="signin">Sign in</button></div>
    </div>
    </div>
  </section>

  <!-- ========== 3. SIGN IN ========== -->
  <section class="screen" id="signin">
    <div class="logo-area"><svg class="logo"><use href="#mark"/></svg></div>
    <svg class="cap" viewBox="0 0 405 52" preserveAspectRatio="none" aria-hidden="true"><path d="M0 52C0 37 20 25 50 24L350 0C382 0 405 22 405 52Z"/></svg>
    <div class="panel">
    <svg class="blob" viewBox="0 0 200 193" aria-hidden="true"><path fill="url(#blobg)" d="M0 0C15 50 50 86 100 90C150 94 175 125 200 193H0Z"/></svg>
    <form id="signinForm" novalidate>
        <div class="tabs">
          <button type="button" class="on" data-type="email">E-mail</button>
          <button type="button" data-type="phone">Phone</button>
        </div>
        <div class="field">
          <input class="ident" id="inIdent" type="email" placeholder="E-mail" aria-label="E-mail" autocomplete="username">
          <span class="ico"><svg class="ic ident-icon" aria-hidden="true"><use href="#i-mail"/></svg></span>
        </div>
        <div class="field">
          <input id="inPass" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
          <button class="ico eye" type="button" aria-label="Show password"><svg class="ic" aria-hidden="true"><use href="#i-key"/></svg></button>
        </div>
        <button class="forgot" id="forgotBtn" type="button">Forgot Password?</button>
        <label class="check left"><input id="remember" type="checkbox"> Remember Password</label>
        <div class="error" role="alert"></div>
        <button class="btn small" type="submit">Sign in</button>
    </form>
    <div class="social"><p>Or continue with</p>
      <div class="social-row">
        <button class="social-btn" type="button" data-social="Google"><i class="fa-brands fa-google"></i>Google</button>
        <button class="social-btn" type="button" data-social="Apple"><i class="fa-brands fa-apple"></i>Apple</button>
      </div>
    </div>
    <div class="footer">
      <button class="back" type="button" data-go="welcome"><span class="circle"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></span>Back</button>
      <div class="switch">Don’t have account?<button type="button" data-go="signup">Sign up</button></div>
    </div>
    </div>
  </section>

  <!-- ========== 4. SUCCESS ========== -->
  <section class="screen success" id="success" aria-live="polite">
    <div class="logo-area"><svg class="logo"><use href="#mark"/></svg></div>
    <svg class="cap" viewBox="0 0 405 52" preserveAspectRatio="none" aria-hidden="true"><path d="M0 52C0 37 20 25 50 24L350 0C382 0 405 22 405 52Z"/></svg>
    <div class="panel">
    <svg class="blob" viewBox="0 0 200 193" aria-hidden="true"><path fill="url(#blobg)" d="M0 0C15 50 50 86 100 90C150 94 175 125 200 193H0Z"/></svg>
    <div class="tick"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg></div>
    <h2 id="sTitle">Success!</h2>
    <p id="sText"></p>
    <p class="demo-note">Demo only — no data is sent to any server.</p>
    <button class="btn" type="button" id="sBtn">Continue</button>
    </div>
  </section>

  <div class="loader" id="loader" role="status"><div class="spin"></div><span id="loadText"></span></div>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

/* ব্রাউজার স্টোরেজ বন্ধ থাকলেও যেন পেজ চলে */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ===== লাইট / নাইট মোড ===== */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('#themeBtn use').setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
  $('#themeBtn').title = t === 'dark' ? 'Light mode' : 'Night mode';
  store.set('demo-theme', t);
}
setTheme(store.get('demo-theme') || 'dark');
$('#themeBtn').onclick = () =>
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ===== পেজ পরিবর্তন ===== */
function show(id){
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  $$('.error').forEach(e => e.textContent = '');
  window.scrollTo(0,0);
}
$$('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));

/* ===== E-mail / Phone যেকোনো একটি ===== */
function setType(form, type){
  const input = $('.ident', form), phone = type === 'phone';
  $$('.tabs button', form).forEach(b => b.classList.toggle('on', b.dataset.type === type));
  input.type = phone ? 'tel' : 'email';
  input.placeholder = phone ? 'Phone' : 'E-mail';
  input.setAttribute('aria-label', input.placeholder);
  input.value = '';
  $('.ident-icon use', form).setAttribute('href', phone ? '#i-phone' : '#i-mail');
  $('.error', form).textContent = '';
}
$$('.tabs button').forEach(b => b.onclick = () => setType(b.closest('form'), b.dataset.type));

/* ===== পাসওয়ার্ড দেখা / লুকানো ===== */
$$('.eye').forEach(b => b.onclick = () => {
  const input = b.previousElementSibling;
  const showIt = input.type === 'password';
  input.type = showIt ? 'text' : 'password';
  $('use', b).setAttribute('href', showIt ? '#i-eye' : '#i-key');
  b.setAttribute('aria-label', showIt ? 'Hide password' : 'Show password');
});

/* ===== যাচাই (Validation) ===== */
function checkIdent(input){
  const v = input.value.trim();
  if (input.type === 'tel')
    return /^\+?\d{10,15}$/.test(v.replace(/[\s-]/g,'')) ? '' : 'Enter a valid phone number (10–15 digits).';
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? '' : 'Enter a valid e-mail address.';
}

/* ===== Loading ও Success ===== */
function loading(text, done){
  $('#loadText').textContent = text;
  $('#loader').classList.add('show');
  $$('.btn, .social-btn, .forgot').forEach(b => b.disabled = true);
  setTimeout(() => {
    $('#loader').classList.remove('show');
    $$('.btn, .social-btn, .forgot').forEach(b => b.disabled = false);
    done();
  }, 1200);
}
function success(title, text, label, next){
  $('#sTitle').textContent = title;
  $('#sText').textContent = text;
  $('#sBtn').textContent = label;
  $('#sBtn').onclick = () => show(next);
  show('success');
}
function resetForm(form){
  form.reset();
  if ($('.tabs', form)) setType(form, 'email');
  $('.error', form).textContent = '';
  $$('.eye', form).forEach(b => {
    b.previousElementSibling.type = 'password';
    $('use', b).setAttribute('href', '#i-key');
  });
}

/* ===== ডেমো অ্যাকাউন্ট: শুধু নাম ও E-mail/Phone রাখা হয়, পাসওয়ার্ড সেভ হয় না ===== */
let account = null;
try { account = JSON.parse(store.get('mvbd-account')); } catch(e){}
const normalize = v => v.includes('@') ? v.trim().toLowerCase() : v.replace(/[\s-]/g,'');

$('#signupForm').onsubmit = e => {
  e.preventDefault();
  const f = e.target;
  const first = $('#first').value.trim(), last = $('#last').value.trim();
  const msg =
    !first ? 'Please enter your first name.' :
    !last ? 'Please enter your last name.' :
    checkIdent($('#upIdent')) ||
    ($('#upPass').value.length < 6 ? 'Password must be at least 6 characters.' : '') ||
    (!$('#terms').checked ? 'Please accept the Terms & Conditions.' : '');
  $('.error', f).textContent = msg;
  if (msg) return;

  account = { name: first + ' ' + last, id: normalize($('#upIdent').value) };
  store.set('mvbd-account', JSON.stringify(account));
  loading('Creating your account…', () => {
    resetForm(f);
    success('Sign Up Successful!', 'Welcome, ' + account.name + '. Now sign in with your e-mail/phone and password.', 'Sign in now', 'signin');
  });
};

/* ডেমো: সঠিক ফরম্যাটের E-mail/Phone ও ৬ অক্ষরের পাসওয়ার্ড দিলেই সাকসেস */
$('#signinForm').onsubmit = e => {
  e.preventDefault();
  const f = e.target;
  const id = $('#inIdent').value.trim();
  const msg =
    checkIdent($('#inIdent')) ||
    ($('#inPass').value.length < 6 ? 'Password must be at least 6 characters.' : '');
  $('.error', f).textContent = msg;
  if (msg) return;

  if ($('#remember').checked) store.set('demo-id', id); else store.del('demo-id');
  const name = account && account.id === normalize(id) ? account.name : id;
  loading('Signing you in…', () => {
    resetForm(f);
    fillRemembered();
    success('Login Successful!', 'Welcome back, ' + name, 'Log out', 'welcome');
  });
};

/* ===== Forgot Password (ডেমো) ===== */
$('#forgotBtn').onclick = () => {
  const f = $('#signinForm'), input = $('#inIdent');
  const msg = checkIdent(input);
  $('.error', f).textContent = msg;
  if (msg) { input.focus(); return; }
  const id = input.value.trim();
  loading('Sending reset link…', () =>
    success('Reset Link Sent!', 'Demo: a password reset link would be sent to ' + id, 'Back to Sign in', 'signin'));
};

/* Remember করা E-mail / Phone ফিরিয়ে আনা (পাসওয়ার্ড নয়) */
function fillRemembered(){
  const id = store.get('demo-id');
  if (!id) return;
  setType($('#signinForm'), id.includes('@') ? 'email' : 'phone');
  $('#inIdent').value = id;
  $('#remember').checked = true;
}
fillRemembered();

/* ===== Google / Apple (ডেমো) ===== */
$$('[data-social]').forEach(b => b.onclick = () => {
  const p = b.dataset.social;
  loading('Connecting to ' + p + ' (demo)…', () =>
    success('Login Successful!', 'You signed in with ' + p + ' (demo).', 'Log out', 'welcome'));
});
</script>
</body>
</html>
